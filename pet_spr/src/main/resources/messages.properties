# General Errors
exception.general=An unexpected error occurred. Please try again later.
exception.unauthorized=Authentication required. Please provide a valid token.
exception.forbidden=You do not have permission to access this resource.
exception.forbidden.update-delete=You do not have permission to modify or delete this resource.

# Validation Errors
invalid.general=The value of field ''{0}'' is invalid.
invalid.general.format=The format of field ''{0}'' is invalid.
invalid.general.required=The field ''{0}'' is required.
invalid.general.not-blank=This field cannot be blank.
invalid.password-format=Password must be at least 8 characters long, contain at least one uppercase letter, one lowercase letter, one number, and one special character.
invalid.date-format=Invalid date format. Please use yyyy-MM-dd.
invalid.date-future=The date must be in the future.
invalid.datetime-format=Invalid datetime format. Please use yyyy-MM-dd HH:mm:ss.

# Authentication Errors
exception.auth.incorrect.username=Incorrect username or user not found.
exception.auth.incorrect.password=Incorrect password.
exception.auth.account.not.enabled=Your account is not enabled. Please check your email to activate.
exception.auth.account.locked=Your account has been locked.
exception.auth.invalid.refresh.token=The provided refresh token is invalid.
exception.auth.expired.refresh.token=The refresh token has expired. Please log in again.
exception.auth.expired.access.token=The access token is invalid

# User Errors
exception.user.not.found.username=User with username ''{0}'' not found.
exception.user.not.found.id=User with ID ''{0}'' not found.
exception.user.not.found.email= User with email ''{0}'' not found
exception.user.existed.email= User with email ''{0}'' existed
